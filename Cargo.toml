[package]
name = "weather-buoys"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.3"
rayon = "1.10"
flate2 = "1.0"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
indicatif = "0.18.6"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.151"
serde = { version = "1.0", features = ["derive"] }